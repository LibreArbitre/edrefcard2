name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests, rendering and real mapper workflow
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install application and browser test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmagickwand-dev
          python -m pip install -r requirements.txt
          npm install --prefix "$RUNNER_TEMP/e2e-browser" --no-save --package-lock=false playwright@1.62.1
          "$RUNNER_TEMP/e2e-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Python regression suite (blocking)
        run: python -m pytest --junitxml="$RUNNER_TEMP/test-artifacts/unit.xml"
      - name: Real ImageMagick rendering and A4/Letter PDF checks (blocking)
        run: python tests/rendering_integration.py "$PWD" "$PWD/www" "$RUNNER_TEMP/test-artifacts/rendering"
      - name: Real authenticated mapper workflow (blocking)
        env:
          NODE_PATH: ${{ runner.temp }}/e2e-browser/node_modules
        run: |
          mkdir -p "$RUNNER_TEMP/test-artifacts/mapper"
          python -u tests/mapper_e2e_server.py --source-www "$PWD/www" \
            --state-file "$RUNNER_TEMP/mapper-state.json" \
            > "$RUNNER_TEMP/test-artifacts/mapper/server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 60); do
            if [ -s "$RUNNER_TEMP/mapper-state.json" ]; then
              base=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["base_url"])' "$RUNNER_TEMP/mapper-state.json")
              if curl --fail --silent "$base/admin/login" > /dev/null; then ready=true; break; fi
            fi
            kill -0 "$server_pid" || exit 1
            sleep 1
          done
          test "$ready" = true
          node tests/mapper_workflow.cjs "$RUNNER_TEMP/mapper-state.json" "$RUNNER_TEMP/test-artifacts/mapper"
      - name: New test harness lint (blocking)
        run: |
          ruff check tests/mapper_e2e_server.py --select F
          node --check tests/mapper_workflow.cjs
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-evidence
          path: ${{ runner.temp }}/test-artifacts/
          retention-days: 7
          if-no-files-found: warn

  docker:
    name: Container build and startup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t edrefcard-test .
      - name: Start an isolated CI container
        run: docker run -d --name edrefcard-ci -p 127.0.0.1:8080:8000 -e APP_ENV=test edrefcard-test
      - name: Wait for the real application
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/ > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Container failure logs
        if: failure()
        run: docker logs --tail 100 edrefcard-ci
      - name: Remove only the disposable CI container
        if: always()
        run: docker rm -f edrefcard-ci

  legacy-static-analysis:
    name: Legacy static analysis (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install ruff mypy types-requests types-Flask types-cffi
      - name: Ruff legacy debt (advisory, not a test gate)
        continue-on-error: true
        run: ruff check www tests
      - name: Mypy legacy debt (advisory, not a test gate)
        continue-on-error: true
        run: mypy www/scripts/
