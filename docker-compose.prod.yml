version: '3.8'

services:
  edrefcard:
    build: .
    volumes:
      - edrefcard_data:/app/www/configs
    environment:
      - PYTHONUNBUFFERED=1
      - EDREFCARD_ADMIN_USER
      - EDREFCARD_ADMIN_PASS
      - FLASK_SECRET_KEY
      - APP_URL
      - EDREFCARD_CONFIGS_DIR=/app/www/configs
    restart: unless-stopped
    # PAS DE PORTS - Dokploy/Traefik gère le routing automatiquement
    # Le conteneur écoute sur le port 8000 en interne (défini dans Dockerfile)
    # Traefik route le trafic depuis les domaines configurés

volumes:
  edrefcard_data:
