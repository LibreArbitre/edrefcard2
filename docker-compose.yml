version: '3.8'

services:
  edrefcard:
    build: .
    ports:
      - "8080:8000"
    volumes:
      - edrefcard_data:/app/www/configs
    environment:
      - PYTHONUNBUFFERED=1
      # Port published directly, no reverse proxy: trust no X-Forwarded-* header
      - TRUSTED_PROXY_HOPS=0
    user: root
    restart: unless-stopped

volumes:
  edrefcard_data:
